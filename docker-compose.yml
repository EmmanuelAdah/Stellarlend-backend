services:
  postgres:
    image: postgres:16-alpine
    container_name: stellarlend-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellarlend
      POSTGRES_PASSWORD: stellarlend
      POSTGRES_DB: stellarlend
    ports:
      - "5432:5432"
    volumes:
      - stellarlend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarlend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stellarlend-postgres-data:
